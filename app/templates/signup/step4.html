<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Categories — Bakery Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f2ef;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e1b18;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            padding: 14px 24px 6px 24px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 590;
            color: #1c1c1e;
            letter-spacing: 0.2px;
        }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px 20px;
            scrollbar-width: thin;
        }

        .main-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .main-scroll::-webkit-scrollbar-track {
            background: #f0eeeb;
            border-radius: 10px;
        }

        .main-scroll::-webkit-scrollbar-thumb {
            background: #d4c5b8;
            border-radius: 10px;
        }

        .hero-section {
            padding: 20px 0 16px 0;
            text-align: center;
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: #f7f3ef;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .icon-wrapper i {
            font-size: 36px;
            color: #c27e4a;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #2b221a, #aa6f42);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }

        .subhead {
            font-size: 14px;
            color: #8f7e6c;
            font-weight: 500;
        }

        .form-card {
            background: #ffffff;
            border-radius: 28px;
            margin-bottom: 20px;
        }

        .input-group {
            background: #fbf9f7;
            border-radius: 20px;
            border: 1px solid #efe5dc;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .input-group:focus-within {
            border-color: #c27e4a;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(194, 126, 74, 0.08);
        }

        .input-field {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px;
        }

        .input-field i {
            font-size: 22px;
            color: #bb8b64;
            width: 24px;
            margin-top: 2px;
        }

        .input-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-content label {
            font-size: 14px;
            font-weight: 700;
            color: #4a3a2c;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .required-badge {
            font-size: 11px;
            font-weight: 500;
            background: #f0ede8;
            padding: 3px 10px;
            border-radius: 30px;
            color: #8f7e6c;
        }

        .categories-hint {
            font-size: 12px;
            color: #aa9a88;
            background: #faf8f5;
            padding: 8px 12px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .categories-hint i {
            font-size: 14px;
            color: #c27e4a;
        }

        textarea {
            width: 100%;
            border: none;
            background: transparent;
            font-family: 'Inter', monospace;
            font-size: 15px;
            font-weight: 500;
            color: #2b241e;
            outline: none;
            resize: vertical;
            padding: 0;
            margin: 0;
            line-height: 1.5;
            min-height: 240px;
        }

        textarea::placeholder {
            color: #cbbcaa;
            font-weight: 400;
            font-family: 'Inter', monospace;
        }

        .example-chip {
            background: #f2eee9;
            border-radius: 30px;
            padding: 8px 14px;
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .example-chip span {
            font-size: 12px;
            font-weight: 500;
            color: #6b5a48;
        }

        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background: #ffffff;
            border: 1px solid #e3d9d0;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 500;
            color: #5e4e3c;
            transition: all 0.1s;
        }

        .btn-finish {
            width: 100%;
            background: #c27e4a;
            border: none;
            border-radius: 60px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 17px;
            color: white;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            margin-top: 8px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(194, 126, 74, 0.2);
        }

        .btn-finish:active {
            transform: scale(0.97);
            background: #a66c3d;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #aa9a88;
            padding: 12px 0 18px 0;
            border-top: 0.5px solid #efebe6;
            margin-top: 8px;
            background: #ffffff;
        }

        .home-indicator {
            width: 130px;
            height: 5px;
            background: #dad3cc;
            border-radius: 100px;
            margin: 8px auto 12px auto;
        }

        .message-container {
            margin-bottom: 16px;
        }

        .alert-message {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff6f0;
            border-radius: 18px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            border-left: 3px solid #cd6b6b;
            color: #b1624a;
        }

        .alert-success {
            border-left-color: #2b7e4a;
            background: #f0f9f0;
            color: #235e3a;
        }

        .progress-steps {
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .progress-bar-bg {
            height: 2px;
            background: #efe5dc;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            background: #c27e4a;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .counter-badge {
            background: #e8e2dc;
            border-radius: 40px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            color: #8f7e6c;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="status-bar"></div>

    <div class="main-scroll">
        <div class="hero-section">
            <div class="icon-wrapper">
                <i class="ti ti-category"></i>
            </div>
            <h1>Organize your menu</h1>
            <div class="subhead">Add categories to group your products</div>
        </div>

        <!-- step indicator: step 4 active (final step) -->
        <div class="progress-steps">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                <div style="flex: 1; text-align: center;">
                    <div style="width: 32px; height: 32px; background: #c27e4a; border-radius: 40px; display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; margin-bottom: 6px;">1</div>
                    <div style="font-size: 11px; font-weight: 600; color: #c27e4a;">Account</div>
                </div>
                <div style="flex: 1; text-align: center;">
                    <div style="width: 32px; height: 32px; background: #c27e4a; border-radius: 40px; display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; margin-bottom: 6px;">2</div>
                    <div style="font-size: 11px; font-weight: 600; color: #c27e4a;">Theme</div>
                </div>
                <div style="flex: 1; text-align: center;">
                    <div style="width: 32px; height: 32px; background: #c27e4a; border-radius: 40px; display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; margin-bottom: 6px;">3</div>
                    <div style="font-size: 11px; font-weight: 600; color: #c27e4a;">Profile</div>
                </div>
                <div style="flex: 1; text-align: center;">
                    <div style="width: 32px; height: 32px; background: #c27e4a; border-radius: 40px; display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; margin-bottom: 6px;">4</div>
                    <div style="font-size: 11px; font-weight: 700; color: #c27e4a;">Categories</div>
                </div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div id="messageContainer" class="message-container"></div>

        <div class="form-card">
            <form method="post" id="categoriesForm" novalidate>
                {% csrf_token %}

                <div class="input-group">
                    <div class="input-field">
                        <i class="ti ti-list-tree"></i>
                        <div class="input-content">
                            <label>
                                Menu categories
                                <span class="required-badge">Required</span>
                            </label>
                            <textarea 
                                name="categories" 
                                id="categoriesTextarea"
                                placeholder="Cakes&#10;Cupcakes&#10;Cookies&#10;Brownies&#10;Pastries"
                                required
                            ></textarea>
                            <div class="categories-hint">
                                <i class="ti ti-info-circle"></i>
                                <span>One category per line · Max 20 categories</span>
                                <span id="categoryCountBadge" class="counter-badge">0 categories</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Example / inspiration chips -->
                <div class="example-chip">
                    <span><i class="ti ti-bulb" style="font-size: 14px;"></i> Ideas:</span>
                    <div class="chip-list" id="suggestionChips">
                        <button type="button" class="chip" data-suggest="Cakes">🎂 Cakes</button>
                        <button type="button" class="chip" data-suggest="Cupcakes">🧁 Cupcakes</button>
                        <button type="button" class="chip" data-suggest="Cookies">🍪 Cookies</button>
                        <button type="button" class="chip" data-suggest="Brownies">🍫 Brownies</button>
                        <button type="button" class="chip" data-suggest="Pastries">🥐 Pastries</button>
                        <button type="button" class="chip" data-suggest="Bread">🍞 Bread</button>
                        <button type="button" class="chip" data-suggest="Donuts">🍩 Donuts</button>
                    </div>
                </div>

                <button type="submit" class="btn-finish" id="finishBtn">
                    <i class="ti ti-sparkles"></i>
                    Finish setup
                </button>
            </form>

            <div class="footer-note">
                <i class="ti ti-device-mobile"></i> Your store will be live instantly · Add products later
            </div>
        </div>
    </div>
    <div class="home-indicator"></div>
</div>

<script>
    const categoriesForm = document.getElementById('categoriesForm');
    const categoriesTextarea = document.getElementById('categoriesTextarea');
    const messageContainer = document.getElementById('messageContainer');
    const finishBtn = document.getElementById('finishBtn');
    const categoryCountBadge = document.getElementById('categoryCountBadge');
    let messageTimeout = null;

    // Helper: clear any floating message
    function clearMessage() {
        if (messageTimeout) {
            clearTimeout(messageTimeout);
            messageTimeout = null;
        }
        const existing = messageContainer.querySelector('.alert-message');
        if (existing) existing.remove();
    }

    function showMessage(text, isError = true) {
        clearMessage();
        const msgDiv = document.createElement('div');
        msgDiv.className = 'alert-message';
        if (!isError) {
            msgDiv.classList.add('alert-success');
        }
        msgDiv.innerHTML = `<i class="ti ${isError ? 'ti-alert-circle' : 'ti-check-circle'}"></i><span>${text}</span>`;
        messageContainer.appendChild(msgDiv);
        messageTimeout = setTimeout(() => {
            if (msgDiv) msgDiv.remove();
            messageTimeout = null;
        }, 4000);
    }

    // Parse categories from textarea value (split by line, trim, filter empty)
    function parseCategories(raw) {
        const lines = raw.split(/\r?\n/);
        return lines
            .map(line => line.trim())
            .filter(line => line !== "");
    }

    // Update category counter badge
    function updateCategoryCounter() {
        const raw = categoriesTextarea.value;
        const categories = parseCategories(raw);
        const count = categories.length;
        let badgeText = `${count} categor${count === 1 ? 'y' : 'ies'}`;
        if (count === 0) badgeText = '0 categories';
        categoryCountBadge.innerText = badgeText;
        
        // visual feedback if too many categories
        if (count > 20) {
            categoryCountBadge.style.background = "#fde2d4";
            categoryCountBadge.style.color = "#c27e4a";
        } else {
            categoryCountBadge.style.background = "#e8e2dc";
            categoryCountBadge.style.color = "#8f7e6c";
        }
        return categories;
    }

    // Validate categories: must have at least 1, max 20, each <= 40 chars
    function validateCategories(categoriesArray) {
        if (categoriesArray.length === 0) {
            return { valid: false, error: "Please add at least one category" };
        }
        if (categoriesArray.length > 20) {
            return { valid: false, error: "You can add up to 20 categories maximum" };
        }
        for (let i = 0; i < categoriesArray.length; i++) {
            const cat = categoriesArray[i];
            if (cat.length > 40) {
                return { valid: false, error: `Category "${cat.substring(0, 30)}..." is too long (max 40 chars)` };
            }
            if (/[<>{}]/.test(cat)) {
                return { valid: false, error: `Category "${cat}" contains invalid characters` };
            }
        }
        // check duplicates (case-insensitive)
        const lowerSet = new Set();
        for (let cat of categoriesArray) {
            const lowerCat = cat.toLowerCase();
            if (lowerSet.has(lowerCat)) {
                return { valid: false, error: `Duplicate category: "${cat}"` };
            }
            lowerSet.add(lowerCat);
        }
        return { valid: true, error: null };
    }

    // Real-time counter update
    categoriesTextarea.addEventListener('input', () => {
        updateCategoryCounter();
        clearMessage(); // remove any old validation error when user types
    });

    // Suggestion chip click: append category name, add new line if needed
    const suggestionChips = document.querySelectorAll('.chip[data-suggest]');
    suggestionChips.forEach(chip => {
        chip.addEventListener('click', (e) => {
            e.preventDefault();
            const suggested = chip.getAttribute('data-suggest');
            if (!suggested) return;
            
            let currentValue = categoriesTextarea.value;
            const currentCategories = parseCategories(currentValue);
            // check duplicate to avoid adding same category again (case-insensitive)
            const lowerSuggested = suggested.toLowerCase();
            if (currentCategories.some(c => c.toLowerCase() === lowerSuggested)) {
                showMessage(`"${suggested}" already exists in your list`, true);
                return;
            }
            
            if (currentCategories.length >= 20) {
                showMessage("Maximum 20 categories reached. Remove some before adding.", true);
                return;
            }
            
            // Append new category on new line
            if (currentValue.trim() === "") {
                categoriesTextarea.value = suggested;
            } else {
                categoriesTextarea.value = currentValue + "\n" + suggested;
            }
            updateCategoryCounter();
            // auto focus and move cursor
            categoriesTextarea.focus();
            clearMessage();
            // optional brief success hint
            setTimeout(() => {
                showMessage(`Added "${suggested}"`, false);
                setTimeout(() => clearMessage(), 1500);
            }, 50);
        });
    });

    // Form submit: final validation + loading effect
    categoriesForm.addEventListener('submit', (e) => {
        clearMessage();
        const rawCategories = categoriesTextarea.value;
        const categoriesArray = parseCategories(rawCategories);
        
        const validation = validateCategories(categoriesArray);
        if (!validation.valid) {
            e.preventDefault();
            showMessage(validation.error, true);
            // scroll to message
            messageContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            return;
        }
        
        // OPTIONAL: If we want to clean whitespace & rebuild textarea nicely
        const cleanedLines = categoriesArray.join('\n');
        if (cleanedLines !== rawCategories) {
            categoriesTextarea.value = cleanedLines;
        }
        
        // Show loading state on button
        const originalHtml = finishBtn.innerHTML;
        finishBtn.innerHTML = '<i class="ti ti-loader"></i> Creating store...';
        finishBtn.disabled = true;
        
        // re-enable after 5 seconds in case of network issue (to prevent infinite loading)
        setTimeout(() => {
            if (finishBtn.disabled) {
                finishBtn.innerHTML = originalHtml;
                finishBtn.disabled = false;
            }
        }, 8000);
        
        // allow form to submit (actual POST)
    });

    // Initial counter update + pre-fill if old value exists (Django context)
    if (categoriesTextarea.value.trim() !== "") {
        updateCategoryCounter();
    } else {
        // optionally prefill with empty placeholder
        updateCategoryCounter();
    }
    
    // Remove default required HTML5 popup but we keep required attribute for semantics
    categoriesTextarea.addEventListener('invalid', (e) => {
        e.preventDefault();
        showMessage("Please add at least one category", true);
    });
    
    // Server side message handling (Django integration)
    window.addEventListener('DOMContentLoaded', () => {
        {% if error %}
            setTimeout(() => {
                showMessage("{{ error|escapejs }}", true);
            }, 100);
        {% endif %}
        {% if success_msg %}
            setTimeout(() => {
                showMessage("{{ success_msg|escapejs }}", false);
            }, 100);
        {% endif %}
        
        // Ensure textarea height auto-adjustment based on content
        const textarea = categoriesTextarea;
        function adjustHeight() {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 320) + 'px';
        }
        textarea.addEventListener('input', adjustHeight);
        adjustHeight();
        
        console.log('Step 4 categories — ready, bakery ordering system');
    });
    
    // for better UX, trim on blur
    categoriesTextarea.addEventListener('blur', () => {
        const raw = categoriesTextarea.value;
        const lines = parseCategories(raw);
        if (lines.length) {
            const cleaned = lines.join('\n');
            if (cleaned !== raw) {
                categoriesTextarea.value = cleaned;
                updateCategoryCounter();
            }
        }
    });
</script>
</body>
</html>
